[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utaweave"
version = "0.2.0"
description = "Audio-to-score-to-singing tools for Japanese song revoicing"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.26,<2", "soundfile>=0.12", "scipy>=1.10", "librosa>=0.10,<0.11"]
dev = ["build", "mido"]
ui = ["numpy>=1.26,<2", "soundfile>=0.12", "scipy>=1.10", "librosa>=0.10,<0.11", "mido>=1.3,<2"]

[project.scripts]
utaweave = "song2voice.cli:main"
song2voice = "song2voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"song2voice.rendering" = ["listening_player.js"]
"song2voice.voice_conversion" = ["svc.lock.json"]
"song2voice.web" = ["static/*.html", "static/*.css", "static/*.js"]
